<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PITWALL · PC 미리보기</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101316;color:#e9ebeb}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:40px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}h1{font-size:19px;letter-spacing:.07em;margin:0}h1:before{content:"";display:inline-block;width:4px;height:20px;background:#e84539;vertical-align:middle;margin-right:10px}header span,.hint{font-size:13px;color:#9ba3a9}.screen{background:#0a0c0f;border:1px solid #343b41;padding:8px}canvas{display:block;width:100%;height:auto}.screenbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 20px 14px;color:#a2a7ad;font-size:12px}.screenbar-buttons{display:flex;gap:8px}button{font:inherit;cursor:pointer;background:#292d30;color:#eff0ef;border:1px solid #51585c;padding:9px 16px}button:hover{background:#383e42}button:focus-visible,input:focus-visible{outline:2px solid #47c6a2;outline-offset:3px}.control{border-top:1px solid #353b3f;margin-top:32px;padding-top:20px}h2{font-size:14px;margin:0 0 8px;letter-spacing:.04em}.control p{margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.field label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}.field output{color:#47c6a2;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#47c6a2}.actions{display:flex;gap:8px;margin-top:24px}.note{line-height:1.7;margin-top:24px}.badge{color:#47c6a2}@media(max-width:650px){main{padding:24px 14px}header{align-items:flex-start;flex-direction:column;margin-bottom:20px}.grid{grid-template-columns:1fr;gap:14px}.screenbar{padding:5px;font-size:10px}.screenbar button{padding:7px;font-size:11px}}
</style></head><body><main><header><h1>PITWALL <span> / PC 미리보기</span></h1><span>ANDROID TELEMETRY PROTOTYPE</span></header>
<div class="screen"><canvas id="display" width="900" height="390" aria-label="속도, RPM, 가속 입력을 표시하는 안드로이드 앱 미리보기"></canvas><div class="screenbar"><span id="status">OBD 연결 대기　 /　 —</span><div class="screenbar-buttons"><button id="connect">OBD 연결</button><button id="demo">데모 보기</button></div></div></div>
<section class="control"><h2>시뮬레이션 컨트롤</h2><p class="hint">슬라이더를 움직이면 수동 입력으로 전환됩니다.</p><div class="grid"><div class="field"><label for="speed">속도 <output id="speedOut">65 km/h</output></label><input id="speed" type="range" min="0" max="200" value="65"></div><div class="field"><label for="rpm">엔진 회전수 <output id="rpmOut">3250 rpm</output></label><input id="rpm" type="range" min="0" max="8000" step="50" value="3250"></div><div class="field"><label for="pedal">가속 페달 <output id="pedalOut">50%</output></label><input id="pedal" type="range" min="0" max="100" value="50"></div></div><div class="actions"><button id="manual">수동 입력 표시</button><button id="reset">연결 대기 화면</button></div><p class="hint note"><span class="badge">PC 미리보기</span>는 실제 OBD 연결이나 브레이크 센서 값을 읽지 않습니다. 안드로이드 앱의 화면과 데모 동작을 확인하기 위한 시뮬레이션입니다.</p></section></main>
<script>
const canvas=document.querySelector('#display'),ctx=canvas.getContext('2d');const $=s=>document.querySelector(s);const fields=['speed','rpm','pedal'];let mode='waiting', start=performance.now(),vals={speed:-1,rpm:-1,pedal:-1};
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function text(s,x,y,size,color,bold=false){ctx.fillStyle=color;ctx.font=`${bold?'700':'400'} ${size}px ${bold?'"Arial Narrow", "Roboto Condensed", sans-serif':'Arial, sans-serif'}`;ctx.fillText(s,x,y)}function draw(){ctx.clearRect(0,0,900,390);rect(0,0,900,390,'#0a0c0f');rect(27,24,4,24,'#e84539');text('PITWALL',42,45,25,'#f1f2f2',true);text('TELEMETRY  /  01',750,42,13,'#959ba2',true);rect(27,61,846,2,'#343b41');text('VEHICLE SPEED',30,98,13,'#a2a9b0',true);text(vals.speed<0?'—':vals.speed,26,192,100,'#f3f4f3',true);text('KM/H',31,219,14,'#939ca4',true);rect(301,86,2,138,'#343b41');text('ENGINE',330,98,13,'#a2a9b0',true);text(vals.rpm<0?'—':vals.rpm,326,192,77,'#f3f4f3',true);text('RPM',331,219,14,'#939ca4',true);text('INPUT',30,263,13,'#a2a9b0',true);text('가속 페달',115,263,15,'#e4e6e7',true);text(vals.pedal<0?'—':vals.pedal+'%',730,264,22,'#f2f2f1',true);rect(30,278,840,21,'#262c30');if(vals.pedal>=0)rect(30,278,840*vals.pedal/100,21,'#47c6a2');for(let i=1;i<20;i++)rect(30+i*42,278,1,21,'#0a0c0f');text('BRAKE',30,338,14,'#919ba2',true);text('차량 신호 확인 필요',115,338,14,'#9aa2a8');rect(30,352,840,7,'#262c30')}
function outputs(){for(const k of fields)$('#'+k+'Out').textContent=$('#'+k).value+(k==='speed'?' km/h':k==='rpm'?' rpm':'%')}
function manual(){mode='manual';for(const k of fields)vals[k]=Number($('#'+k).value);$('#status').textContent='수동 시뮬레이션 · 실제 차량값 아님　 /　 시뮬레이션';$('#demo').textContent='데모 보기';outputs();draw()}
for(const k of fields)$('#'+k).addEventListener('input',manual);$('#manual').onclick=manual;$('#reset').onclick=()=>{mode='waiting';vals={speed:-1,rpm:-1,pedal:-1};$('#status').textContent='OBD 연결 대기　 /　 —';$('#demo').textContent='데모 보기';draw()};$('#connect').onclick=()=>{$('#status').textContent='PC 미리보기에서는 OBD 연결을 지원하지 않습니다'};$('#demo').onclick=()=>{if(mode==='demo'){$('#reset').click();return}mode='demo';start=performance.now();$('#status').textContent='데모 데이터 · 실제 차량값 아님　 /　 시뮬레이션';$('#demo').textContent='데모 종료'};
function animate(now){if(mode==='demo'){const pedal=Math.trunc(50+45*Math.sin((now-start)/1000*.8));vals={pedal,rpm:Math.trunc(1500+pedal*35),speed:Math.trunc(35+pedal*.7)};draw()}requestAnimationFrame(animate)}draw();outputs();requestAnimationFrame(animate);
</script></body></html>
