<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PITWALL PC 미리보기</title>
<style>
:root {
  color-scheme: light;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  background: #e9e7e2;
  color: #1b1a18;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 980px; margin: auto; padding: 36px 20px 56px; }
h1 { font-size: 22px; margin: 0 0 6px; }
h2 { font-size: 16px; margin: 0 0 4px; }
p { margin: 0; line-height: 1.6; color: #5d5a54; font-size: 14px; }

.phone { margin: 24px 0 32px; background: #101416; border-radius: 8px; padding: 10px 14px 12px; }
canvas { display: block; width: 100%; height: auto; }
.bar { display: flex; align-items: center; gap: 8px; padding: 2px 22px 4px; }
.bar span { flex: 1; min-width: 0; font-size: 13px; color: #a3a09a; }
.bar button { background: none; color: #f4f2ec; border: 1px solid #55534f; border-radius: 6px; padding: 10px 18px; }
.bar button:hover { background: #1d1d1f; }
.bar button.main { background: #d0ed54; color: #101416; border-color: #d0ed54; }
.bar button.main:hover { background: #fff; }

button { font: inherit; font-size: 14px; cursor: pointer; background: #fff; color: #1b1a18; border: 1px solid #b9b5ad; border-radius: 6px; padding: 9px 16px; }
button:hover { background: #f6f5f2; }
button:focus-visible, input:focus-visible { outline: 2px solid #1b1a18; outline-offset: 3px; }
.bar button:focus-visible { outline-color: #f2a900; }

.sliders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin: 20px 0; }
.sliders label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
.sliders output { font-variant-numeric: tabular-nums; color: #5d5a54; }
input[type=range] { width: 100%; accent-color: #1b1a18; }
.actions { display: flex; gap: 8px; margin-bottom: 20px; }

@media (max-width: 650px) {
  main { padding: 20px 12px 40px; }
  .phone { border-radius: 14px; padding: 6px 8px 8px; }
  .bar { padding: 2px 6px; flex-wrap: wrap; }
  .bar span { flex-basis: 100%; font-size: 12px; }
  .bar button { padding: 8px 12px; font-size: 13px; }
  .sliders { grid-template-columns: 1fr; gap: 16px; }
}
</style>
</head>
<body>
<main>
  <h1>PITWALL PC 미리보기</h1>
  <p>데모를 재생하거나 가속 입력과 회전수를 직접 조절해 보세요.</p>

  <div class="phone">
    <canvas id="display" width="1800" height="780" aria-label="속도, 엔진 회전수, 가속 페달을 표시하는 앱 화면"></canvas>
    <div class="bar">
      <span id="status">OBD 연결 대기</span>
      <button id="connect" class="main">OBD 연결</button>
      <button id="demo">데모 보기</button>
    </div>
  </div>

  <h2>수동 입력</h2>
  <p>슬라이더를 움직이면 데모가 멈추고 넣은 값이 화면에 표시됩니다.</p>
  <div class="sliders">
    <div><label for="speed">속도 <output id="speedOut"></output></label><input id="speed" type="range" min="0" max="200" value="65"></div>
    <div><label for="rpm">엔진 회전수 <output id="rpmOut"></output></label><input id="rpm" type="range" min="0" max="8000" step="50" value="3250"></div>
    <div><label for="pedal">가속 페달 <output id="pedalOut"></output></label><input id="pedal" type="range" min="0" max="100" value="50"></div>
  </div>
  <div class="actions">
    <button id="manual">이 값으로 표시</button>
    <button id="reset">연결 대기 화면으로</button>
  </div>
  <p>브레이크는 앱에서도 아직 읽지 않아 빈 칸으로 둡니다.</p>
</main>
<script>
const $ = s => document.querySelector(s);
const canvas = $('#display'), ctx = canvas.getContext('2d');
ctx.scale(2, 2); // 앱과 같은 900×390 좌표계, 선명도를 위해 2배로 그림

const BG = '#101416', INK = '#f4f2ec', DIM = '#9caaa9', TRACK = '#293136';
const LIME = '#d0ed54', GREEN = '#6ed6aa';
const DIGITS = '"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif';
const LABEL = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,sans-serif';

const fields = ['speed', 'rpm', 'pedal'];
const units = { speed: ' km/h', rpm: ' rpm', pedal: '%' };
let mode = 'waiting', start = 0, pedalLabel = '가속 페달';
let vals = { speed: -1, rpm: -1, pedal: -1 };

function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
function text(s, x, y, size, color, bold, align = 'left') {
  ctx.fillStyle = color; ctx.textAlign = align;
  ctx.font = `${bold ? 'italic 700' : 400} ${size}px ${bold ? DIGITS : LABEL}`;
  ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
function makeReadout(columns) {
  const glyphs = Array.from({length: columns}, () => ({digit: -1, previous: -1, changed: 0}));
  let valid = false;
  return function(value, edge, baseline, size, pitch, now) {
    if (value < 0) {
      valid = false;
      text('—', edge, baseline, size, INK, true, 'right');
      return false;
    }
    let moving = false, remaining = value;
    glyphs.forEach((glyph, column) => {
      const next = column === 0 || remaining > 0 ? remaining % 10 : -1;
      remaining = Math.trunc(remaining / 10);
      if (!valid || glyph.digit !== next) {
        glyph.previous = valid ? glyph.digit : -1;
        glyph.digit = next;
        glyph.changed = valid ? now : now - 90;
      }
      const progress = Math.max(0, Math.min(1, (now - glyph.changed) / 90));
      const fade = (1 - progress) ** 2, x = edge - column * pitch;
      if (fade > 0 && glyph.previous >= 0) {
        ctx.globalAlpha = 100 / 255 * fade;
        text(String(glyph.previous), x, baseline - size * .025 * (1-fade), size, INK, true, 'right');
      }
      if (next >= 0) {
        ctx.globalAlpha = 1 - 100 / 255 * fade;
        text(String(next), x, baseline + size * .025 * fade, size, INK, true, 'right');
      }
      ctx.globalAlpha = 1;
      moving ||= progress < 1;
    });
    valid = true;
    return moving;
  };
}
const speedText = makeReadout(3), rpmText = makeReadout(5), pedalText = makeReadout(3);

let rpmWidth = -1, pedalHeight = -1, lastFrame = 0, frame = 0;
function approach(current, target, weight) {
  if (target < 0 || current < 0 || Math.abs(target - current) < 0.35) return target;
  return current + (target - current) * weight;
}
function bar(x, y, width, height, color) {
  if (width <= 0 || height <= 0) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, width, height, 2);
  ctx.fill();
}
function draw(now = performance.now()) {
  const weight = -Math.expm1(-Math.min(32, Math.max(1, now - lastFrame)) / 22);
  lastFrame = now;
  const rpmTarget = vals.rpm < 0 ? -1 : 624 * Math.min(8000, vals.rpm) / 8000;
  const pedalTarget = vals.pedal < 0 ? -1 : 268 * Math.min(100, vals.pedal) / 100;
  rpmWidth = approach(rpmWidth, rpmTarget, weight);
  pedalHeight = approach(pedalHeight, pedalTarget, weight);
  rect(0, 0, 900, 390, BG);
  rect(690, 0, 210, 390, '#171d20');
  rect(690, 0, 1, 390, TRACK);
  ctx.save(); ctx.transform(1, 0, -.30, 1, 0, 0);
  rect(46, 24, 7, 17, LIME); rect(56, 24, 3, 17, LIME);
  ctx.restore();
  text('PITWALL', 64, 41, 23, INK, true);
  text('TORRES   /   J150', 660, 39, 14, DIM, false, 'right');
  rect(36, 55, 624, 1, TRACK);
  text('ENGINE SPEED', 36, 84, 13, DIM, false);
  text('× 1,000 rpm', 660, 84, 13, DIM, false, 'right');
  ctx.save(); ctx.translate(42, 98); ctx.transform(1, 0, -.34, 1, 0, 0);
  rect(0, 0, 618, 18, TRACK);
  if (rpmWidth > 0) rect(0, 0, rpmWidth * 618 / 624, 18, LIME);
  ctx.restore();
  for (let i = 0; i <= 8; i++) {
    const x = 36 + 624 * i / 8;
    rect(Math.min(x,659),121,1,5,DIM);
    text(String(i),x,144,14,DIM,false,i===0?'left':i===8?'right':'center');
  }
  text('속도',36,193,15,DIM,false);
  const speedMoving = speedText(vals.speed,305,319,148,86,now);
  text('km/h',321,319,20,DIM,false);
  rect(412,187,1,146,TRACK);
  text('회전수',442,193,15,DIM,false);
  const rpmMoving = rpmText(vals.rpm,656,291,56,33,now);
  text('rpm',656,319,18,DIM,false,'right');
  text('페달 입력',714,40,16,INK,false);
  rect(714,55,162,1,TRACK);
  bar(726,83,38,268,TRACK);
  bar(726,351-pedalHeight,38,pedalHeight,GREEN);
  const pedalMoving = pedalText(vals.pedal,751,75,17,10,now);
  if(vals.pedal>=0) text('%',754,75,13,DIM,false);
  text(pedalLabel,745,375,13,DIM,false,'center');
  ctx.strokeStyle='#495456'; ctx.lineWidth=1; ctx.strokeRect(820.5,83.5,37,267);
  text('미지원',839,222,11,'#85928f',false,'center');
  text('—',839,75,17,'#85928f',true,'center');
  text('브레이크',839,375,13,DIM,false,'center');
  if (speedMoving || rpmMoving || pedalMoving || mode === 'demo' || rpmWidth !== rpmTarget || pedalHeight !== pedalTarget) {
    frame = requestAnimationFrame(animate);
  }
}

function outputs() { for (const k of fields) $('#' + k + 'Out').textContent = $('#' + k).value + units[k]; }
function manual() {
  cancelAnimationFrame(frame);
  mode = 'manual';
  for (const k of fields) vals[k] = Number($('#' + k).value);
  $('#status').textContent = '직접 넣은 값 · 실제 차량값 아님';
  $('#demo').textContent = '데모 보기';
  outputs(); draw();
}
function reset() {
  cancelAnimationFrame(frame);
  mode = 'waiting'; vals = { speed: -1, rpm: -1, pedal: -1 };
  $('#status').textContent = 'OBD 연결 대기';
  $('#demo').textContent = '데모 보기';
  draw();
}
for (const k of fields) $('#' + k).addEventListener('input', manual);
$('#manual').onclick = manual;
$('#reset').onclick = reset;
$('#connect').onclick = () => { $('#status').textContent = 'PC 미리보기에서는 OBD에 연결할 수 없습니다'; };
$('#demo').onclick = () => {
  if (mode === 'demo') { reset(); return; }
  cancelAnimationFrame(frame);
  mode = 'demo'; start = performance.now();
  $('#status').textContent = '데모 데이터 · 실제 차량값 아님';
  $('#demo').textContent = '데모 종료';
  frame = requestAnimationFrame(animate);
};
function animate(now) {
  if (mode === 'demo') {
    const pedal = Math.trunc(50 + 45 * Math.sin((now - start) / 1000 * .8));
    vals = { pedal, rpm: Math.trunc(1500 + pedal * 35), speed: Math.trunc(35 + pedal * .7) };
  }
  draw(now);
}
draw(); outputs();
</script>
</body>
</html>
