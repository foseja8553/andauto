plugins { id 'com.android.application' }

android {
    namespace 'com.torquescope'
    compileSdk 35
    defaultConfig {
        applicationId 'com.torquescope'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '0.7'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/rustJni')
}

def rustDir = rootProject.file('telemetry')
def rustOutput = new File(rustDir, 'target/aarch64-linux-android/release/libpitwall_telemetry.so')
def generatedLibs = layout.buildDirectory.dir('generated/rustJni/arm64-v8a')
tasks.register('buildRust', Exec) {
    workingDir rustDir
    inputs.files(fileTree(new File(rustDir, 'src')), new File(rustDir, 'Cargo.toml'), new File(rustDir, 'Cargo.lock'))
    outputs.file(rustOutput)
    doFirst {
        def ndk = System.getenv('ANDROID_NDK_HOME')
        if (!ndk) throw new GradleException('ANDROID_NDK_HOME must point to Android NDK r27d')
        def os = System.getProperty('os.name').toLowerCase()
        def host = os.contains('mac') ? 'darwin-x86_64' : os.contains('windows') ? 'windows-x86_64' : 'linux-x86_64'
        def suffix = os.contains('windows') ? '.cmd' : ''
        environment 'RUSTFLAGS', '-C link-arg=-Wl,-z,max-page-size=16384'
        environment 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER', "${ndk}/toolchains/llvm/prebuilt/${host}/bin/aarch64-linux-android23-clang${suffix}"
    }
    commandLine 'cargo', 'build', '--locked', '--release', '--target', 'aarch64-linux-android'
}
tasks.register('copyRust', Copy) {
    dependsOn 'buildRust'
    from rustOutput
    into generatedLibs
}
tasks.named('preBuild').configure { dependsOn 'copyRust' }
